[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly_engine"
version = "0.1.0"
description = "Vectorized Anomaly Detection Engine & MLOps Governance Framework"
authors = [{ name = "James Beall", email = "BeallJamesP@gmail.com" }]
requires-python = ">=3.12"

dependencies = [
    "polars>=0.20.0",
    "scikit-learn>=1.4.0",
    "shap>=0.44.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
cloud = [
    "pyarrow>=15.0.0",
    "s3fs>=2024.2.0",
    "fsspec>=2024.2.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
