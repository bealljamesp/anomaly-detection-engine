[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection-engine"
version = "0.1.0"
description = "Scalable Anomaly Detection & MLOps Governance Framework"
authors = [{ name = "James Beall", email = "BeallJamesP@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "shap>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
